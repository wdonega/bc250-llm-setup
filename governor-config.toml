# cyan-skillfish-governor-smu — BC-250 tuning
#
# Installed by 50-governor.sh to /etc/cyan-skillfish-governor-smu/config.toml
# Upstream: https://github.com/filippor/cyan-skillfish-governor
#
# These values are a measured starting point, not universal truth. The voltage
# safe-points are silicon-level settings — do not invent values here. The one
# number you are EXPECTED to re-measure on your own board is the thermal
# behaviour (see [temperature] and the README).

# How often the governor samples load, and how often it acts on it.
# sample in us, adjust in us.
[timing.intervals]
sample = 250
adjust = 100_000

[gpu-usage]
fix-metrics = true
fix-freq = false
method = "busy-flag" # "busy-flag" , "process" or "kernel"
flush-every = 10

[gpu]
set-method = "smu"  # "smu" or "kernel"

[dbus]
enabled = true


# Optional: set initial frequency range limits
# Both min and max can be omitted or set to 0 for no limit
#
# max only governs short bursts. Under sustained inference the thermal ceiling
# is what actually decides the clock — on a well-cooled 24 CU board this
# settles around 1700 MHz on its own, without oscillating. Raising max does
# not raise sustained clocks.
[frequency-range]
min = 1000    # MHz
max = 1900   # MHz

# MHz/ms
[timing.ramp-rates]
normal = 1
burst = 50

# number of samples
[timing]
burst-samples = 60
down-events = 5

# MHz
[frequency-thresholds]
adjust = 10

# %
[load-target]
upper = 0.65
lower = 0.50

# °C
#
# throttling            clock down above this
# throttling_recovery   clock back up below this
#
# The 10 °C gap is hysteresis. Narrow it and the governor oscillates between
# states instead of settling. If the clock gets stuck low and never recovers,
# this gap is the first thing to look at.
[temperature]
throttling = 88
throttling_recovery = 78

# Frequency/voltage pairs the governor interpolates between. Anything above
# 2000 MHz is commented out on purpose: the entries exist upstream, but this
# board cannot cool them under sustained load, and undervolting at the top of
# the curve is how you get silent output corruption rather than a clean crash.
[[safe-points]]
frequency = 500
voltage = 700

[[safe-points]]
frequency = 1000
voltage = 800

[[safe-points]]
frequency = 1175
voltage = 850

[[safe-points]]
frequency = 1500
voltage = 900

[[safe-points]]
frequency = 1600
voltage = 910

[[safe-points]]
frequency = 1700
voltage = 920

[[safe-points]]
frequency = 1850
voltage = 930

[[safe-points]]
frequency = 2000
voltage = 960

